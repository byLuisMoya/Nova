[package]
name = "nova-server"
version = "1.0.0"
edition = "2021"
description = "Agente de Nova para servidores Linux: publica métricas del sistema en JSON"
license = "MIT"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
